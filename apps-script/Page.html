<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#fdf2f8; color:#374151; }
    .wrap{ max-width:520px; margin:0 auto; padding:18px 16px 32px; text-align:center; }
    h1{ font-size:22px; color:#db2777; margin:6px 0 4px; }
    .sub{ font-size:13px; color:#6b7280; margin-bottom:14px; }
    .photo{ background:#fff; border-radius:16px; padding:10px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
    .photo img{ display:block; width:100%; height:auto; border-radius:8px; }
    .btn{ display:block; margin:16px auto 0; padding:14px 18px; border-radius:14px; background:#ec4899; color:#fff; font-size:17px; font-weight:700; text-decoration:none; }
    .tip{ font-size:13px; color:#6b7280; margin-top:14px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📸 행복네컷</h1>
    <div class="sub"><?= name ?></div>
    <div class="photo"><img src="<?= dataUrl ?>" alt="행복네컷 사진"></div>
    <a class="btn" href="<?= downloadUrl ?>">사진 내려받기</a>
    <div class="tip">
      사진을 <b>길게 눌러</b> “사진 앱에 저장”해도 돼요.<br>

    </div>
  </div>

</html>
